name: ITF Juniors Sweden

on:
  workflow_dispatch:
    inputs:
      week:
        description: 'next, this, or YYYY-MM-DD'
        required: true
        default: 'next'
  schedule:
    - cron: '0 18 * * 5'

permissions:
  contents: write

jobs:
  build-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python itf_junior_tracker.py --week "${{ github.event.inputs.week || 'next' }}"
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/next_week.md reports/swedish_entries.json
          git commit -m "Update ITF junior report" || echo "No changes"
          git push
