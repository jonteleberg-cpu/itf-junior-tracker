name: Weekly ITF Junior Tracker

on:
  workflow_dispatch:
  schedule:
    - cron: "0 20 * * 0"

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium

      - name: Run tracker
        run: python -m itf_junior_tracker --week next

      - name: List data files
        run: find data -maxdepth 3 -type f -print || true

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: itf-junior-reports
          path: data
          if-no-files-found: error
