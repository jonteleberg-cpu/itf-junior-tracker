name: Weekly ITF Junior Tracker

on:
  workflow_dispatch:
  schedule:
    - cron: "0 20 * * 0"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium

      - name: Run tracker
        run: python -m itf_junior_tracker --week next

      - name: List data files
        run: find data -maxdepth 4 -type f -print || true

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: itf-junior-reports
          path: data
          if-no-files-found: error

      - name: Commit reports to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/weekly_report.txt data/weekly_report.md data/swedish_entries.json data/swedish_entries.xlsx data/history/

          if git diff --cached --quiet; then
            echo "No report changes to commit."
          else
            git commit -m "Update weekly ITF junior report"
            git push
          fi
